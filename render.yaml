# Render Blueprint — AEGIS-MARKET-STATISTICS (CAPSTONE-PW26_SSS_08)
#
# SCOPE: Capstone Phase-3 Review 1 — the statistics carve-out only.
#
#   aegis-stats-api : the Python execution service (backend/server.py)
#   aegis-stats-web : the Next.js interface, which proxies to it
#                     via app/api/aegis/[...path]/route.ts
#
# These two are FRONTEND and BACKEND, not "stats" and "multimodal". Both are the
# stats side. The names are scoped to `stats` deliberately, so the combined Review 3
# system can take the unqualified `aegis-api` / `aegis-web` names without a rename.
#
# ---------------------------------------------------------------------------
# HOW TO APPLY A CHANGE TO THIS FILE
# ---------------------------------------------------------------------------
# Committing this file is NOT enough. autoDeploy redeploys a service when its CODE
# changes; it does NOT re-read this blueprint. After committing, open the blueprint
# (Dashboard -> Blueprints -> AEGIS-MARKET-STATISTICS) and click "Manual sync",
# then confirm the "Sync:" header shows your new commit hash. A blueprint whose
# render.yaml was deleted in some commit stops syncing until you sync it by hand.
#
# ---------------------------------------------------------------------------
# ROADMAP NOTE — read before adding a third service at Review 2/3
# ---------------------------------------------------------------------------
# The multimodal (text + audio) work should NOT become its own Render service.
# BlockCombiner weighs calibrated per-block scores IN-PROCESS, and a zero-coverage
# block gets zero weight. Splitting modalities across services turns the Review 3
# merge into a distributed-systems problem: cross-service latency inside a scoring
# call, partial-failure semantics, and coverage flags that would depend on whether
# an HTTP request succeeded. Add the affect/text/audio blocks to FEATURE_BLOCKS in
# THIS service instead, and raise its plan. The audio/image dependencies
# (soundfile, Pillow, imageio, imageio-ffmpeg) are already pinned in requirements.txt.
#
# ---------------------------------------------------------------------------
# CHANGED in this revision
# ---------------------------------------------------------------------------
#  * Both URLs are now literal. Render assigned the unsuffixed hostnames
#    aegis-stats-api.onrender.com and aegis-stats-web.onrender.com, so the two
#    values that used to be `sync: false` no longer need filling in by hand.
#    If you ever RENAME a service, these two literals must change with it.
#  * Web startCommand is explicit about host and port. `next start` printed a
#    Network address (so it was binding correctly), but Render logged
#    "No open ports detected, continuing to scan" — the explicit flags remove
#    any dependence on Next's defaults.
#  * NODE_OPTIONS caps V8 old space; see the comment on that key.
#  * The API buildCommand is a single line. An earlier revision used a multi-line
#    `python - <<'PY'` heredoc, which is fragile if Render collapses the YAML
#    block. The Git-LFS guard now lives in scripts/render_build_check.py.

services:
  # ------------------------------------------------------------ backend (API)
  - type: web
    name: aegis-stats-api
    runtime: python
    region: singapore          # swap to oregon/frankfurt if your workspace prefers
    plan: free                 # newer workspaces name this 0.5c-512mb
    branch: main
    autoDeploy: true

    # MINIMAL — keeps the build log purely a pip log while the API is still failing.
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt

    # WITH GUARD — switch to this once the minimal build succeeds AND you have
    # committed scripts/render_build_check.py. It fails the BUILD if the Git-LFS
    # tracked panel files (data/panel/cash_panel.{parquet,csv}, see .gitattributes)
    # were checked out as pointers, instead of letting every live module that reads
    # the cash panel die at request time with an opaque parquet error.
    # buildCommand: pip install --upgrade pip && pip install -r requirements.txt && python scripts/render_build_check.py

    # backend/server.py defaults to 127.0.0.1:8787. Render requires 0.0.0.0:$PORT.
    # The CLI flags override the AEGIS_BACKEND_HOST/PORT env vars, and $PORT is
    # expanded by the shell here (it would NOT be expanded inside an envVars value).
    startCommand: python -m backend.server --host 0.0.0.0 --port $PORT

    # VERIFIED against backend/server.py: the router registers
    #   ("GET", re.compile(r"^/api/health$"), "health")
    healthCheckPath: /api/health

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11           # pyproject requires >=3.12; Render now defaults to 3.14.x,
                                 # which the pinned numpy/pandas wheels were not resolved against
      - key: AEGIS_BACKEND_TOKEN
        generateValue: true      # Render mints a random secret; aegis-stats-web reads the same one
      - key: AEGIS_ALLOWED_ORIGINS
        value: https://aegis-stats-web.onrender.com,http://localhost:3000,http://127.0.0.1:3000
        # Only consulted for requests that carry an Origin header. The Next.js proxy
        # calls this service from Node, server-side, so it arrives with no Origin and
        # is treated as a non-browser client. The bearer token is the real control.
        # The localhost entries keep run_dev.bat working.
      - key: PYTHONUNBUFFERED
        value: "1"               # so research/core/progress.py Ticker output reaches Render logs

  # ----------------------------------------------------------- frontend (web)
  - type: web
    name: aegis-stats-web
    runtime: node
    region: singapore          # must match the API's region if you later use private networking
    plan: free
    branch: main
    autoDeploy: true

    buildCommand: npm ci && npm run build
    startCommand: npx next start -H 0.0.0.0 -p $PORT

    envVars:
      - key: NODE_VERSION
        value: "20"               # package.json engines: node >=20
      - key: NODE_OPTIONS
        value: --max-old-space-size=460
        # public/data/market.json is 9.2 MB and /markets renders on demand, so it is
        # re-parsed per request; that costs several times 9.2 MB in heap. On a 512 MB
        # free instance V8 aborts (exit 134, SIGABRT) rather than collecting. Capping
        # old space below the container limit makes V8 GC hard instead of dying.
        # MITIGATION, NOT A FIX. The fix is to cache the parsed bundle in module
        # scope in lib/data.ts, or to emit a trimmed market.json carrying only the
        # fields the markets page renders.
      - key: AEGIS_BACKEND_URL
        value: https://aegis-stats-api.onrender.com
      - key: AEGIS_BACKEND_TOKEN
        fromService:
          name: aegis-stats-api
          type: web
          envVarKey: AEGIS_BACKEND_TOKEN
        # Never set this by hand on either service. If the two values diverge, every
        # proxied call is rejected and the UI silently serves stored artifacts.
      - key: AEGIS_BACKEND_TIMEOUT_MS
        value: "180000"           # default is 120000; a free-tier cold start alone costs ~50s,
                                  # and a cold start plus a live module run can exceed 120s —
                                  # the proxy would abort and fall back to a stored artifact
