      mode: LIVE
      typical_seconds: 2.0
      summary: >-
        The reliability curve at a binning you choose. Expected calibration error
        depends on the bin count, so the control is exposed rather than fixed: an ECE
        quoted without its binning is a number nobody can check.
      inputs:
        - name: arm
          kind: select
          label: Arm
          default: FULL
          options:
