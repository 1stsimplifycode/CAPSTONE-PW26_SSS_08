    depends_on: [STATS-01]
    wrapper_status: WRAPS_EXISTING_PROTECTED
    status: SUPPORTED
    experiment_id: EXP-BASE-1
    limitations: [L-04, L-11]
    notes: >-
      Regenerating overwrites artifacts the claim ledger cites. Requires --force.
    ui:
      icon: ⚖
      product_name: Compared with simpler methods
      route: /stats/baselines
      product_headline: Whether the model beats something simple
      product_question: Does the evidence stack outperform a simple statistical detector on
        the same rows and the same metric?
      product_actions:
      - Compare the full stack against each baseline
      - Check that every arm is scored on identical rows
      - Read the lift over the base rate rather than the raw number
      product_observation: The full evidence stack separates episodes far better than the statistical-anomaly
        baseline on the same rows under the same metric definitions.
      product_risk: A baseline comparison on injected episodes measures the generator as much
        as the detector (L-04). Regenerating this artifact is protected because the claim ledger
        cites it.
