  - id: STATS-15
    index: 15
    category: STATS
    slug: robustness_generalization
    name: Robustness and generalization
    purpose: >-
      Performance under feature noise, input corruption, induced missingness and reduced
      training data, and transfer across time periods and across disjoint instrument sets.
    research_question: >-
      Where does the detector stop being reliable, and does it transfer beyond the
      instruments and period it was fitted on?
    canonical:
      - research/evaluation/robustness.py
      - scripts/run_robustness_generalization.py
    adapter: scripts.stages.stats:robustness_generalization
    inputs:
      - data/panel/market_dataset.parquet
    outputs:
      - outputs/stats/15_robustness_generalization/robustness.csv
      - outputs/stats/15_robustness_generalization/generalization.csv
      - outputs/stats/15_robustness_generalization/run.json
    depends_on: [STATS-13]
    wrapper_status: WRAPS_EXISTING
    status: PARTIAL
    experiment_id: null
    limitations: [L-11]
    notes: >-
      Five axes execute: additive noise, value dropout, stale feed, outlier injection and
      per-block blackout on the evaluation inputs; a symbol-level training-size curve;
      expanding-window transfer forward in time; and transfer to disjoint tickers. The
      model is fitted once on clean data for the input-degradation axis, because refitting
      on corrupted data measures whether the learner adapts, which is an easier and
      different question than what a deployed model does when its feed degrades. Training
      subsampling drops whole symbols rather than random rows: rows from one instrument
      are serially dependent, so row-level dropping leaves nearly every instrument
      represented and understates how much the model depends on breadth. The frozen
      holdout is never read -- assert_no_holdout() raises on any frame carrying holdout
      rows and every fit passes through it. Cross-dataset transfer remains BLOCKED and is
      reported as such, because only one dataset exists. Adversarial robustness is NOT
      RUN: every corruption here is random, and an adversarial claim needs a threat model.
    ui:
      icon: ⊘
      product_name: What happens when data degrades
      route: /stats/robustness
      product_headline: How stable the result is when the inputs degrade
      product_question: How much does performance fall when features are noisy, stale, missing,
        or when there is less training data?
      product_actions:
      - Compare each corruption family against the clean reference
      - Read the learning curve to see whether more data would help
      - Check transfer across time folds and across instrument groups
      product_observation: Additive noise is the worst input failure and a stale feed the mildest.
        Transfer to disjoint instruments is close to in-sample; transfer forward in time is
        weaker and improves as history accumulates.
      product_risk: Every corruption here is random or structural. Adversarial robustness is
        NOT RUN and is a different property that needs an attacker model.
      confidence: MODERATE
      visual: robustness_lines
      product_metrics:
      - label: Conditions tested
        value: json:outputs/stats/15_robustness_generalization/run.json#robustness_rows
        format: int
        note: corruption family by severity
      - label: Worst degradation
        value: json:outputs/stats/15_robustness_generalization/run.json#worst_degradation.degradation
        format: float4
        note: AUPRC lost in the worst condition
      - label: Instrument transfer
        value: json:outputs/stats/15_robustness_generalization/run.json#instrument_transfer.auprc_mean
        format: float4
        note: mean AUPRC on held-out instruments
      - label: Forward-in-time transfer
        value: json:outputs/stats/15_robustness_generalization/run.json#period_transfer.auprc_mean
        format: float4
        note: mean AUPRC on later periods
      research_metrics:
      - label: Worst corruption
        value: json:outputs/stats/15_robustness_generalization/run.json#worst_degradation.corruption
        format: text
      - label: Instrument transfer range (min)
        value: json:outputs/stats/15_robustness_generalization/run.json#instrument_transfer.auprc_min
        format: float4
      - label: Period transfer range (min)
        value: json:outputs/stats/15_robustness_generalization/run.json#period_transfer.auprc_min
        format: float4
      - label: Second-dataset transfer
        value: json:outputs/stats/15_robustness_generalization/run.json#dataset_transfer.status
        format: text
      - label: Adversarial robustness
        value: json:outputs/stats/15_robustness_generalization/run.json#adversarial_robustness
        format: text
      - label: Holdout policy
        value: json:outputs/stats/15_robustness_generalization/run.json#holdout_policy
        format: text
      figures:
      - figR04_stats_input_robustness
      - figR05_stats_learning_curve
      - figR06_stats_generalization
      tables:
      - table08_robustness
      inputs:
      - kind: corruption
        label: Corruption family
        note: Choose which degradation family to chart. All families are pre-computed; nothing
          is re-run here.
    analysis:
      adapter: scripts.stages.stats:analyse_robustness
      mode: LIVE
      typical_seconds: 65.0
      summary: >-
        One perturbation condition, run now: the model is fitted on clean data and
        scored on degraded inputs. Fitting once is the point — refitting on corrupted
        data asks whether the learner adapts, which is not what a degraded feed does to
        a deployed model.
      inputs:
        - name: corruption
          kind: select
          label: Failure mode
          default: gaussian
          options:
            - gaussian
            - dropout
            - stale
            - outliers
          note: >-
            stale is a delayed feed, which is more common in production than noise and
            invisible to a null check
        - name: severity
          kind: float
          label: Severity
          default: 0.1
          minimum: 0.01
          maximum: 0.5
          note: >-
            the fraction of values affected, or the noise scale
        - name: block
          kind: select
          label: Applied to
          default: all
          options:
            - all
            - text
            - image
            - audio
            - video
            - market
            - microstructure
            - regime
            - propagation
          note: >-
            degrade every feature, or only one block's
        - name: seed
          kind: int
          label: Seed
          default: 20260818
          minimum: 1
          maximum: 99999999
          note: >-
            changing it changes which values are hit

  - id: STATS-16
    index: 16
    category: STATS
    slug: multiseed_significance
    name: Multi-seed and statistical significance
    purpose: >-
      Repeat the stochastic parts of the pipeline across seeds and report mean, standard
      deviation, minimum, maximum and 95% confidence interval, then apply the existing
      cluster bootstrap, paired permutation, Benjamini-Hochberg correction and power
      analysis to the repeated measurements.
    research_question: >-
      How much of the reported difference between arms is seed variance rather than signal?
    # `will_consume:` used to sit here, listing the statistics machinery separately from
    # `canonical:` because no driver called it yet. The driver now exists and the adapter
    # runs it, so that machinery has moved into `canonical:` where it belongs.
    canonical:
      - research/evaluation/multiseed.py
      - scripts/run_multiseed.py
      - research/statistics/tests.py
      - research/statistics/power.py
    adapter: scripts.stages.stats:multiseed_significance
    inputs:
      - data/panel/market_dataset.parquet
    outputs:
      - outputs/stats/16_multiseed_significance/seed_table.csv
      - outputs/stats/16_multiseed_significance/significance.json
      - outputs/stats/16_multiseed_significance/seed_summary.csv
      - outputs/stats/16_multiseed_significance/paired_tests.csv
    depends_on: [STATS-13, STATS-14]
    wrapper_status: WRAPS_EXISTING
    status: SUPPORTED
    experiment_id: null
    limitations: [L-12]
    notes: >-
      Every ablation arm is refitted across a declared seed ladder and the repeated
      measurements are handed to the machinery that already existed: cluster bootstrap,
      paired sign-flip permutation and Benjamini-Hochberg. Two sources of variation are
      kept apart, because conflating them is how a seed study overstates its own
      precision -- spread across seeds on one fixed evaluation set is seed variance, and
      the cluster bootstrap interval within one run is sampling variance of the evaluation
      set. A pooled seed noise floor is reported, and an arm difference smaller than that
      floor is recorded as not established however it looked in a single run. Differences
      that dissolve are listed alongside the ones that survive rather than filtered out.
      Validation only: repeating a measurement on the frozen holdout across ten seeds
      would be ten looks at the data the freeze exists to protect.
    ui:
      icon: ⊛
      product_name: What counts as a real difference
      route: /stats/multi-seed
      product_headline: How much of a difference is just the random seed
      product_question: Is an observed difference between two arms bigger than what re-seeding
        alone produces?
      product_actions:
      - Read the seed noise floor before comparing any two arms
      - See which differences survive multiplicity correction across seeds
      - Check the minimum detectable effect before reading a null result
      product_observation: Every arm was refitted across ten seeds. A difference smaller than
        the 95% seed noise floor is inside what re-seeding alone produces and is not established
        by this experiment.
      product_risk: The floor is computed on the validation split and does not extend to the
        frozen holdout (L-11). Repeating the measurement there would be ten looks at data that
        gets one.
      confidence: HIGH
      visual: seed_spread
      product_metrics:
      - label: Arms
        value: json:outputs/stats/16_multiseed_significance/significance.json#n_arms
        format: int
        note: refitted per seed
      - label: Seeds
        value: json:outputs/stats/16_multiseed_significance/significance.json#n_seeds
        format: int
        note: independent refits per arm
      - label: Seed noise floor (95%)
        value: json:outputs/stats/16_multiseed_significance/significance.json#seed_noise_floor.noise_floor_95
        format: float4
        note: smallest difference this experiment can establish
      - label: Differences established
        value: json:outputs/stats/16_multiseed_significance/significance.json#differences_surviving_correction
        format: count
        note: after correction
      research_metrics:
      - label: Pooled seed standard deviation
        value: json:outputs/stats/16_multiseed_significance/significance.json#seed_noise_floor.pooled_seed_sd
        format: float5
      - label: Fits executed
        value: json:outputs/stats/16_multiseed_significance/significance.json#n_fits
        format: int
      - label: Differences inside the noise floor
        value: json:outputs/stats/16_multiseed_significance/significance.json#differences_within_seed_noise
        format: count
      - label: Minimum detectable effect
        value: json:outputs/stats/16_multiseed_significance/significance.json#minimum_detectable_effect.minimum_detectable_effect
        format: float5
      - label: Holdout policy
        value: json:outputs/stats/16_multiseed_significance/significance.json#holdout_policy
        format: text
      figures:
      - figR07_seed_variability
      tables:
      - table06_multiseed
      - table13_statistical_significance
    analysis:
      adapter: scripts.stages.stats:analyse_seed_noise
      mode: LIVE
      typical_seconds: 50.0
      summary: >-
        Derives the seed noise floor over the arms you select and tests every pair
        against it. A difference smaller than the floor is not a small effect: it is not
        distinguishable from rerunning the same arm with a different seed.
      inputs:
        - name: arms
          kind: multiselect
          label: Arms
          default: []
          max_items: 40
          options:
            - FULL
            - NO_MARKET
            - NO_MICROSTRUCTURE
            - NO_REGIME
            - NO_PROPAGATION
            - NO_DERIVED
            - NO_UNCERTAINTY
            - MARKET_ONLY
            - MICRO_ONLY
            - REGIME_ONLY
            - PROPAGATION_ONLY
            - MARKET_MICRO
            - PRICE_BLOCKS
            - PRICE_BLOCKS_REGIME
            - COMBINER_STATIC
            - COMBINER_EARLY
            - COMBINER_LATE
            - COMBINER_UNCERTAINTY
            - COMBINER_REGIME_INHERITED
            - COMBINER_REGIME_CORRECTED
          note: >-
            leave empty to use every arm with completed seed fits
        - name: alpha
          kind: float
          label: Alpha
          default: 0.05
          minimum: 0.01
          maximum: 0.2
          note: >-
            the level the Benjamini-Hochberg correction controls at

