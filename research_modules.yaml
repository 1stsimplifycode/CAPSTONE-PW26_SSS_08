# AEGIS-Market research module manifest
#
# The single source of truth for the 16 STATS execution modules.
# `STATS/`, every `run.bat` and every module `README.md` are GENERATED
# from this file by `python scripts/validate_structure.py --write`, and checked against it
# by `python scripts/validate_structure.py`. Editing a generated file by hand will be
# reported as drift on the next validation run: change this manifest instead.
#
# IMPORTANT — this manifest describes EXECUTION INTERFACES, not implementations.
# `canonical:` names code that already exists and is not moved, copied or rewritten.
# `adapter:` names a thin dispatcher function in `scripts/stages/` whose only job is to
# import the canonical code and call it. No science lives in the adapter layer.
#
# wrapper_status vocabulary
#   WRAPS_EXISTING            adapter calls existing canonical code; safe to run
#   WRAPS_EXISTING_PROTECTED  same, but regenerating would overwrite artifacts the claim
#                             ledger and documentation already cite; requires --force
#   INFRASTRUCTURE_ONLY       canonical implementation does not exist yet; the module,
#                             its runner and its contract exist so the scientific work can
#                             land in a separate commit. Executing it reports
#                             NOT YET EXECUTED and writes nothing.
#
# status vocabulary is the project's own (docs/LIMITATIONS.md §94):
#   SUPPORTED PARTIAL "NOT SUPPORTED" "NOT RUN" "NOT MEASURED" BLOCKED
#   "OPEN QUESTION" "FUTURE VALIDATION" "FAILED SANITY CHECK"

version: research-modules-v1
generated_by: scripts/validate_structure.py
dispatcher: scripts/run_module.py

exit_codes:
  0: OK
  1: FAILED
  3: BLOCKED
  4: INPUTS MISSING
  5: SKIPPED (protected artifacts; pass --force to regenerate)
  6: NOT YET EXECUTED (infrastructure only)

categories:
  STATS:
    directory: STATS
    master: STATS/run_all_stats.bat
    log_directory: logs/stats
    output_directory: outputs/stats
    description: >-
      Statistical characterisation, validation and evaluation of the risk model and the
      data it is built from.

# The sixteen-week programme. Each week is one STATS module: the statistical treatment and
# the question it answers were designed together and are read together.
#
# This block is the registry the backend serves and the frontend routes from. It declares
# only what cannot be derived. Backend routes, input schemas, output schemas, product and
# research views and artifact sources are all computed from the named module by
# `backend/registry.py`, so a week can never advertise a route, a field or an artifact
# that its module does not actually have.

weeks:
  - week: 1
    title: What the evidence base is made of
    question: >-
      Before any result: what rows exist, how completely are they covered, and how large
      is each split?
    stats_module: STATS-01
    gate:
      capability: evidence-base
      enabled_from_week: 1
    summary: >-
      Structure first. The panel is profiled for coverage, key uniqueness and split sizes.
      It runs over the slice you select rather than over a stored whole-panel figure.
    feature:
      product_question: >-
        What is every other number here built on?
      story: >-
        Profiles the rows behind the analysis, so the size and completeness of the
        evidence base is known before anything is concluded from it.
      headline:
        - module: STATS-01
          metric: rows
          label: Instrument-sessions
        - module: STATS-01
          metric: instruments
          label: Instruments
        - module: STATS-01
          metric: positive_rate
          label: Sessions inside an episode
      primary_visual:
        module: STATS-01
        series: block_coverage
        label_column: block
        value_column: mean_non_null_fraction
        kind: bars
        caption: >-
          How completely each kind of evidence is present on these rows.

  - week: 2
    title: Which instruments the analysis covers
    question: >-
      Is the instrument universe point-in-time, and how did its membership change?
    stats_module: STATS-02
    gate:
      capability: return-behaviour
      enabled_from_week: 2
    summary: >-
      Universe membership and survivorship: who was in the sample, and when. Together they
      bound every population statement made anywhere else.
    feature:
      product_question: >-
        Which instruments does the analysis actually cover?
      story: >-
        Reconstructs which instruments were in the sample at each point in time, and how
        much the membership turned over between reconstitutions.
      headline:
        - module: STATS-02
          metric: ever
          label: Instruments ever covered
        - module: STATS-02
          metric: always
          label: Covered throughout
        - module: STATS-02
          metric: rebalances
          label: Reconstitutions
      primary_visual:
        module: STATS-02
        series: churn
        label_column: rebalance_date
        value_column: members
        kind: line
        caption: >-
          How many instruments were in the sample at each reconstitution.

  - week: 3
    title: Distributions and feature behaviour
    question: >-
      What do the numeric distributions look like, and which features cannot vary on the
      rows selected?
    stats_module: STATS-03
    gate:
      capability: cross-section
      enabled_from_week: 3
    summary: >-
      Descriptive and distributional statistics with per-feature presence, so a
      distribution is never read without knowing how many rows carry it.
    feature:
      product_question: >-
        How do the underlying measurements behave?
      story: >-
        Describes every feature on the selected rows and names the ones that are constant
        there, alongside how completely each is populated.
      headline:
        - module: STATS-03
          metric: features
          label: Features described
        - module: STATS-03
          metric: degenerate
          label: Constant on this slice
        - module: STATS-03
          metric: mean_fill
          label: Average completeness
      primary_visual:
        module: STATS-03
        series: features
        label_column: feature
        value_column: non_null_fraction
        kind: bars
        caption: >-
          How completely each feature is populated, widest variation first.

  - week: 4
    title: Microstructure and liquidity proxies
    question: >-
      What do the liquidity and microstructure proxies show, and which quantities does
      this data source simply not express?
    stats_module: STATS-04
    gate:
      capability: regimes
      enabled_from_week: 4
    summary: >-
      Microstructure-proxy statistics with an explicit register of what is not measurable.
      A proxy is named as a proxy wherever it appears.
    feature:
      product_question: >-
        What were trading conditions like?
      story: >-
        Reads the liquidity and microstructure proxies on the selected rows, and records
        which order-book quantities the source cannot express at all.
      headline:
        - module: STATS-04
          metric: market_features
          label: Market measures
        - module: STATS-04
          metric: proxy_features
          label: Liquidity proxies
        - module: STATS-04
          metric: not_measured
          label: Recorded as unmeasurable
      primary_visual:
        module: STATS-04
        series: coverage
        label_column: feature
        value_column: non_null_fraction
        kind: bars
        caption: >-
          How completely each market and liquidity proxy is populated on these rows.

  - week: 5
    title: Regime statistics
    question: >-
      How are regimes distributed over the sample, and how thin is the smallest of them?
    stats_module: STATS-05
    gate:
      capability: propagation
      enabled_from_week: 5
    summary: >-
      Regime occupancy over your slice, so a regime-conditional reading knows how many
      sessions each conditional statement rests on.
    feature:
      product_question: >-
        What kind of market was this?
      story: >-
        Shows how the selected sessions distribute across market regimes, and how few
        sessions the smallest regime carries.
      headline:
        - module: STATS-05
          metric: regimes
          label: Regimes present
        - module: STATS-05
          metric: largest_share
          label: Largest regime
        - module: STATS-05
          metric: smallest_rows
          label: Smallest regime, sessions
      primary_visual:
        module: STATS-05
        series: occupancy
        label_column: regime_id
        value_column: share
        kind: bars
        caption: >-
          How the selected sessions divide between regimes.

  - week: 6
    title: Dependence and propagation
    question: >-
      How does movement propagate across instruments, and how strong is the typical
      association?
    stats_module: STATS-06
    gate:
      capability: co-movement
      enabled_from_week: 6
    summary: >-
      Dependence and propagation statistics over the instruments you select. Association
      is measured, not interpreted as an economic channel.
    feature:
      product_question: >-
        Did these instruments move together?
      story: >-
        Measures contemporaneous co-movement between the instruments you select, and
        reports the strongest associations it finds.
      headline:
        - module: STATS-06
          metric: pairs
          label: Instrument pairs measured
        - module: STATS-06
          metric: median_abs_corr
          label: Typical association
        - module: STATS-06
          metric: sessions
          label: Sessions measured
      primary_visual:
        module: STATS-06
        series: pairs
        label_column: instrument_b
        value_column: correlation
        kind: bars
        caption: >-
          The strongest associations on the sessions selected.

  - week: 7
    title: Tails and extreme risk
    question: >-
      How heavy are the tails on your slice, and how deep did the drawdowns get?
    stats_module: STATS-07
    gate:
      capability: tails
      enabled_from_week: 7
    summary: >-
      Tail and extreme-risk statistics on the realised next-session return. Every quantity
      is an in-sample description of the window selected.
    feature:
      product_question: >-
        How extreme did moves get?
      story: >-
        Measures the tails of the realised next-session return over the selected window,
        including conditional loss and the deepest drawdown.
      headline:
        - module: STATS-07
          metric: n
          label: Returns measured
        - module: STATS-07
          metric: cvar
          label: Average loss in the worst 5%
        - module: STATS-07
          metric: vol_annual
          label: Annualised volatility
        - module: STATS-07
          metric: max_drawdown
          label: Deepest drawdown
      primary_visual:
        module: STATS-07
        series: tail
        label_column: statistic
        value_column: value
        kind: bars
        caption: >-
          Tail statistics over the sessions selected.

  - week: 8
    title: Episode and event statistics
    question: >-
      How are the injected episodes distributed across instruments and sessions?
    stats_module: STATS-08
    gate:
      capability: detection
      enabled_from_week: 8
    summary: >-
      Episode and event statistics over the window you select. Episodes are injected by
      this project (L-04); they are labels of a construction, not observed incidents.
    feature:
      product_question: >-
        What unusual periods are in this data, and how were they constructed?
      story: >-
        Summarises the injected episodes overlapping the window, their intensity and how
        many sessions each one labels.
      headline:
        - module: STATS-08
          metric: episodes
          label: Episodes in this window
        - module: STATS-08
          metric: instruments
          label: Instruments affected
        - module: STATS-08
          metric: label_rows
          label: Labelled sessions
        - module: STATS-08
          metric: intensity
          label: Mean injected intensity
      primary_visual:
        module: STATS-08
        series: episode_summary
        label_column: quantity
        value_column: value
        kind: bars
        caption: >-
          What the episode labels record.

  - week: 9
    title: Leakage verification
    question: >-
      Can information from after a decision time reach a feature?
    stats_module: STATS-09
    gate:
      capability: leakage
      enabled_from_week: 9
    summary: >-
      The leakage suite run over your slice. A leakage check that passes on the whole
      panel can still be worth re-running on a subset.
    feature:
      product_question: >-
        Could the analysis have seen the future?
      story: >-
        Runs the timing-integrity suite now and reports what it found, check by check.
      headline:
        - module: STATS-09
          metric: passed
          label: Checks passed
        - module: STATS-09
          metric: failed
          label: Checks failed

  - week: 10
    title: Validation metrics at a threshold you choose
    question: >-
      What do the validation metrics say at a threshold you choose?
    stats_module: STATS-10
    gate:
      capability: attribution
      enabled_from_week: 10
    summary: >-
      Threshold-interactive validation metrics: the confusion matrix and everything
      derived from it, recomputed as you move the operating point.
    feature:
      product_question: >-
        How accurate is the signal?
      story: >-
        Reports the confusion matrix at a threshold you choose, with balanced accuracy and
        the per-class breakdown beside it.
      headline:
        - module: STATS-10
          metric: n
          label: Sessions assessed
        - module: STATS-10
          metric: balanced_accuracy
          label: Balanced accuracy
        - module: STATS-10
          metric: mcc
          label: Matthews correlation
        - module: STATS-10
          metric: threshold
          label: Threshold applied
      primary_visual:
        module: STATS-10
        series: per_class
        label_column: class_name
        value_column: f1
        kind: bars
        caption: >-
          How well each class is recovered at this threshold.

  - week: 11
    title: Calibration and uncertainty
    question: >-
      Are the scores calibrated at the bin count you choose?
    stats_module: STATS-11
    gate:
      capability: forecasting
      enabled_from_week: 11
    summary: >-
      Reliability computed over your chosen binning, with the selective-risk curve. Both
      let you change one parameter and watch the number move.
    feature:
      product_question: >-
        How confident should the signal be taken to be?
      story: >-
        Draws the reliability curve at a binning you choose, and shows what accuracy is
        bought by declining to score the least certain rows.
      headline:
        - module: STATS-11
          metric: ece
          label: Calibration error
        - module: STATS-11
          metric: bins
          label: Bins
        - module: STATS-11
          metric: n
          label: Sessions assessed
      primary_visual:
        module: STATS-11
        series: reliability
        label_column: mean_pred
        value_column: observed
        kind: line
        caption: >-
          Predicted score against observed rate. A calibrated score would track the
          diagonal.

  - week: 12
    title: Error analysis
    question: >-
      Where does the scoring fail, and what kind of failure is each mistake?
    stats_module: STATS-12
    gate:
      capability: calibration
      enabled_from_week: 12
    summary: >-
      Error analysis by segment, so a failure mode can be traced to the rows that produced
      it rather than to an aggregate rate.
    feature:
      product_question: >-
        Where does the signal get it wrong?
      story: >-
        Classifies every mistake by kind, diagnosing missing evidence before model error,
        and segments the result by whichever column you choose.
      headline:
        - module: STATS-12
          metric: wrong
          label: Sessions misclassified
        - module: STATS-12
          metric: error_rate
          label: Error rate
        - module: STATS-12
          metric: classes
          label: Distinct failure modes
      primary_visual:
        module: STATS-12
        series: taxonomy
        label_column: error_class
        value_column: rows
        kind: bars
        caption: >-
          What kind of mistake, and how often.

  - week: 13
    title: Baseline comparison
    question: >-
      How do the baselines compare, and is the full stack better than something simpler?
    stats_module: STATS-13
    gate:
      capability: robustness
      enabled_from_week: 13
    summary: >-
      The baseline comparison recomputed from its per-row score files on the rows you
      select. The arms are not refitted here; only their metrics are recomputed.
    feature:
      product_question: >-
        Is this better than something simpler?
      story: >-
        Recomputes detection quality for every arm on the rows you select, and reports
        each one's gap against the reference arm.
      headline:
        - module: STATS-13
          metric: arms
          label: Arms compared
        - module: STATS-13
          metric: best_auprc
          label: Best quality
        - module: STATS-13
          metric: spread
          label: Spread across arms
        - module: STATS-13
          metric: rows
          label: Rows per arm
      primary_visual:
        module: STATS-13
        series: arms
        label_column: arm
        value_column: auprc
        kind: bars
        caption: >-
          Detection quality per arm, on the rows selected.

  - week: 14
    title: Ablation study
    question: >-
      Which components carry the result, and how much does removing each one cost?
    stats_module: STATS-14
    gate:
      capability: causal-reading
      enabled_from_week: 14
    summary: >-
      Ablation arms recomputed from their per-row score files, so the spread between
      configurations is measured on the same rows for all of them.
    feature:
      product_question: >-
        What is each part of the system actually contributing?
      story: >-
        Recomputes each configuration's quality on the rows you select, and reports the
        spread between the best and the worst.
      headline:
        - module: STATS-14
          metric: arms
          label: Configurations compared
        - module: STATS-14
          metric: best_auprc
          label: Best quality
        - module: STATS-14
          metric: spread
          label: Spread across configurations
      primary_visual:
        module: STATS-14
        series: arms
        label_column: arm
        value_column: auprc
        kind: bars
        caption: >-
          Detection quality per configuration, on the rows selected.

  - week: 15
    title: Robustness and generalisation
    question: >-
      What survives perturbation, and how much quality is lost when the inputs degrade?
    stats_module: STATS-15
    gate:
      capability: aggregation
      enabled_from_week: 15
    summary: >-
      One perturbation condition run live against a clean reference. Both are stress
      tests; neither is evidence of performance under a distribution not sampled here.
    feature:
      product_question: >-
        What happens when the data gets worse?
      story: >-
        Degrades the inputs one named failure mode at a time and measures what the
        degradation costs, against an undegraded reference fitted on clean data.
      headline:
        - module: STATS-15
          metric: clean_auprc
          label: Quality on clean data
        - module: STATS-15
          metric: degraded_auprc
          label: Quality when degraded
        - module: STATS-15
          metric: relative
          label: Share of quality lost
      primary_visual:
        module: STATS-15
        series: conditions
        label_column: condition
        value_column: auprc
        kind: bars
        caption: >-
          Clean against degraded, measured the same way.

  - week: 16
    title: Seeds and significance
    question: >-
      How much of the difference between arms is seed noise?
    stats_module: STATS-16
    gate:
      capability: the-whole-picture
      enabled_from_week: 16
    summary: >-
      The multi-seed noise floor recomputed over the seed table. A gap smaller than the
      noise floor is not a finding.
    feature:
      product_question: >-
        Which differences are real?
      story: >-
        Measures how much of the difference between configurations is just the random
        seed, and reports which comparisons survive that floor.
      headline:
        - module: STATS-16
          metric: floor
          label: Noise floor
        - module: STATS-16
          metric: pairs
          label: Comparisons tested
        - module: STATS-16
          metric: resolved
          label: Comparisons resolved
        - module: STATS-16
          metric: seeds
          label: Seeds per configuration
      primary_visual:
        module: STATS-16
        series: per_arm
        label_column: arm
        value_column: auprc_mean
        kind: bars
        caption: >-
          Average quality per configuration across seeds.

modules:

  # ------------------------------------------------------------------ STATS ----

  - id: STATS-01
    index: 1
    category: STATS
    slug: data_integrity_profile
    name: Data and integrity profile
    purpose: >-
      Report what the assembled dataset actually contains before any result is computed
      from it: row and column counts, per-block coverage, missing values, duplicate keys,
      class balance and the train/validation/holdout split sizes.
    research_question: >-
      Does the dataset satisfy the structural preconditions every downstream claim assumes,
      and where is coverage thin enough to bound a conclusion?
    canonical:
      - research/market/features.py::coverage_report
      - research/data/dataset.py::FEATURE_BLOCKS
    adapter: scripts.stages.stats:data_integrity_profile
    inputs:
      - data/panel/market_dataset.parquet
    outputs:
      - outputs/stats/01_data_integrity_profile/profile.json
      - outputs/stats/01_data_integrity_profile/block_coverage.csv
    depends_on: []
    wrapper_status: WRAPS_EXISTING
    status: PARTIAL
    experiment_id: null
    limitations: [L-12]
    notes: >-
      Reports counts and coverage only. Formal leakage verification is STATS-09; the
      confusion-matrix-level validation suite is STATS-10 and is not implemented yet.
    ui:
      icon: ▤
      product_name: What the data contains
      route: /stats/data-integrity
      product_headline: What the dataset actually contains
      product_question: Is the data underneath every other number complete enough to build on?
      product_actions:
      - Read row, column and split counts before trusting any result
      - See which feature blocks are thinly covered
      - Check that no duplicate key exists
      product_observation: Every declared feature block is present and the key is unique. Coverage
        is uneven across blocks, which bounds what any single result can be read to cover.
      product_risk: Counts and coverage only. This module checks structure, not correctness;
        leakage is checked separately in Leakage verification.
      confidence: HIGH
      visual: coverage_bars
      product_metrics:
      - label: Rows
        value: json:outputs/stats/01_data_integrity_profile/profile.json#rows
        format: int
        note: modelling panel rows
      - label: Columns
        value: json:outputs/stats/01_data_integrity_profile/profile.json#columns
        format: int
        note: features plus metadata
      - label: Instruments
        value: json:outputs/stats/01_data_integrity_profile/profile.json#instruments
        format: int
        note: distinct symbols
      - label: Duplicate keys
        value: json:outputs/stats/01_data_integrity_profile/profile.json#duplicate_keys
        format: int
        note: zero is the only acceptable value
      - label: Positive rate
        value: json:outputs/stats/01_data_integrity_profile/profile.json#positive_rate
        format: pct
        note: share of rows inside an injected episode
      research_metrics:
      - label: Train rows
        value: json:outputs/stats/01_data_integrity_profile/profile.json#split_sizes.train
        format: int
      - label: Validation rows
        value: json:outputs/stats/01_data_integrity_profile/profile.json#split_sizes.validation
        format: int
      - label: Holdout rows (frozen)
        value: json:outputs/stats/01_data_integrity_profile/profile.json#split_sizes.holdout
        format: int
      - label: Blocks profiled
        value: csv:outputs/stats/01_data_integrity_profile/block_coverage.csv#rows
        format: int
      figures:
      - figR01_corpus_composition
      tables:
      - table01_dataset_composition
      inputs:
      - kind: dataset
        label: Dataset
        note: 'The assembled modelling panel. Fixed: the product reads exported artifacts and
          never rebuilds a dataset.'
    analysis:
      adapter: scripts.stages.stats:analyse_data_integrity
      mode: LIVE
      typical_seconds: 1.5
      summary: >-
        Profiles the rows you select, now. Block coverage, key uniqueness, split sizes
        and episode rate are recomputed over the selected slice by the same functions
        the regenerating adapter uses; nothing is read from a stored profile.
      inputs:
        - name: date_from
          kind: date
          label: From
          default: '2022-01-01'
          minimum: '2015-04-07'
          maximum: '2026-08-14'
          note: first session included in the profile
        - name: date_to
          kind: date
          label: To
          default: '2024-12-31'
          minimum: '2015-04-07'
          maximum: '2026-08-14'
          note: last session included in the profile
        - name: instruments
          kind: symbols
          label: Instruments
          default: []
          max_items: 60
          note: leave empty to profile every instrument in the range
        - name: split
          kind: select
          label: Split
          default: all
          options: [all, train, validation, holdout]
          note: >-
            the holdout is included in counts and is never scored; selecting it profiles
            its structure only

  - id: STATS-02
    index: 2
    category: STATS
    slug: universe_survivorship
    name: Universe and survivorship statistics
    purpose: >-
      Characterise the point-in-time liquidity-proxy universe: membership over time, churn
      per rebalance, distinct members ever selected, and the turnover statistics that make
      the construction survivorship-safe.
    research_question: >-
      How much does the research universe turn over, and what does that imply for any
      result read as applying to a stable large-cap index?
    canonical:
      - research/data/universe.py::LiquidityProxyUniverse.churn
      - research/data/universe.py::LiquidityProxyUniverse.turnover_stats
    adapter: scripts.stages.stats:universe_survivorship
    inputs:
      - data/panel/universe.parquet
    outputs:
      - outputs/stats/02_universe_survivorship/universe_summary.json
      - outputs/stats/02_universe_survivorship/churn.csv
    depends_on: []
    wrapper_status: WRAPS_EXISTING
    status: SUPPORTED
    experiment_id: null
    limitations: [L-01]
    notes: >-
      The universe is a liquidity proxy, never the Nifty 50. L-01 records why licence-clear
      point-in-time index membership was not obtainable.
    ui:
      icon: ◎
      product_name: Which instruments are covered
      route: /stats/universe
      product_headline: Which instruments are in scope, and how that changed
      product_question: How much does the research universe turn over, and what does that mean
        for a result read as applying to a stable index?
      product_actions:
      - See the membership rule and the rebalance cadence
      - Read churn per rebalance and distinct members ever selected
      - Check the survivorship position before quoting any universe-level number
      product_observation: The universe is a point-in-time liquidity proxy rebuilt at every
        rebalance from sessions strictly before it, so it carries no survivorship advantage.
      product_risk: This is not the Nifty 50 and must never be described as it. No licence-clear
        point-in-time index membership was obtainable (L-01).
      confidence: HIGH
      visual: stat_row
      product_metrics:
      - label: Rebalances
        value: json:outputs/stats/02_universe_survivorship/universe_summary.json#rebalances
        format: int
        note: monthly reconstruction points
