        value: json:outputs/stats/07_tail_extreme_risk/tail_metrics.json#var
        format: float4
        note: daily, historical
      - label: 5% CVaR
        value: json:outputs/stats/07_tail_extreme_risk/tail_metrics.json#cvar
        format: float4
        note: mean loss beyond the VaR
      research_metrics:
      - label: Maximum drawdown
        value: json:outputs/stats/07_tail_extreme_risk/tail_metrics.json#max_drawdown
        format: float4
      - label: Worst single day
        value: json:outputs/stats/07_tail_extreme_risk/tail_metrics.json#worst_day
        format: float4
      - label: Worst day excluding suspects
        value: json:outputs/stats/07_tail_extreme_risk/tail_metrics.json#corporate_action_suspects.worst_day_excluding_suspects
        format: float4
      - label: Corporate-action suspects
        value: json:outputs/stats/07_tail_extreme_risk/tail_metrics.json#corporate_action_suspects.n_rows
        format: int
      figures:
      - fig20_cvar
      - fig21_drawdown
      tables: []
    analysis:
      adapter: scripts.stages.stats:analyse_tail_risk
      mode: LIVE
      typical_seconds: 2.0
      summary: >-
        Tail statistics of the realised next-session return over your slice, computed by
        the same function the exposure gate reads. This is the input distribution, not
        the result of acting on it, and no position size is produced anywhere.
      inputs:
        - name: date_from
          kind: date
          label: From
          default: '2022-01-01'
          minimum: '2015-01-01'
          maximum: '2026-08-14'
          note: >-
            first session in the return series
        - name: date_to
          kind: date
          label: To
          default: '2024-12-31'
          minimum: '2015-01-01'
          maximum: '2026-08-14'
          note: >-
            last session in the return series
        - name: instruments
          kind: symbols
          label: Instruments
          default: []
          max_items: 60
          note: >-
            leave empty for every instrument in the range
        - name: alpha
          kind: float
          label: Tail probability
          default: 0.05
          minimum: 0.01
          maximum: 0.25
          note: >-
            the quantile VaR and CVaR are measured at

