        note: strongest comparison point
      - label: Full stack AUPRC
        value: csv:research_artifacts/experiments/ablation_results.csv#cell:arm=FULL:auprc
        format: float4
        note: the evidence stack
      research_metrics:
      - label: Weakest baseline AUPRC
        value: csv:research_artifacts/experiments/baseline_results.csv#agg:auprc:min
        format: float4
      - label: Full stack AUROC
        value: csv:research_artifacts/experiments/ablation_results.csv#cell:arm=FULL:auroc
        format: float4
