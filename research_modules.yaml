    research_question: >-
      Is the risk score interpretable as a probability, and does the model's own
      uncertainty identify the rows where it should not be trusted?
    canonical:
      - research/evaluation/metrics.py::expected_calibration_error
      - research/evaluation/metrics.py::reliability_curve
      - research/evaluation/information.py::selective_risk
      - research/evaluation/information.py::calibration_by_bucket
    adapter: scripts.stages.stats:calibration_uncertainty
    inputs:
      - research_artifacts/experiments/per_row_FULL.parquet
    outputs:
      - outputs/stats/11_calibration_uncertainty/reliability.csv
      - outputs/stats/11_calibration_uncertainty/calibration.json
    depends_on: [STATS-13]
    wrapper_status: WRAPS_EXISTING
    status: PARTIAL
    experiment_id: EXP-L10-1
    limitations: [L-10]
    notes: >-
      The risk score is not a calibrated probability and is never described as one (L-10).
    ui:
      icon: ◔
      product_name: How confident the signal is
      route: /stats/calibration
      product_headline: Whether the confidence number means anything
      product_question: When the model reports a high score, is it right that often?
      product_actions:
      - Read the reliability curve against the diagonal
      - See the expected calibration error
      - Check calibration before treating a score as a probability
      product_observation: The score separates episodes well while its expected calibration
        error stays far from zero, so it ranks better than it measures and must not be read
        as a probability (L-10).
      product_risk: The risk score must not be read as a probability (L-10). Calibration error
        additionally grows with the model's own reported uncertainty (CLAIM-05).
      confidence: LOW
      visual: reliability
      product_metrics:
      - label: Expected calibration error
        value: json:outputs/stats/11_calibration_uncertainty/calibration.json#ece
        format: float4
        note: lower is better; zero is perfect
      - label: AUPRC
        value: json:outputs/stats/11_calibration_uncertainty/calibration.json#detection.auprc
        format: float4
        note: ranking quality, independent of calibration
      - label: Brier score
        value: json:outputs/stats/11_calibration_uncertainty/calibration.json#detection.brier
        format: float4
        note: squared error of the probability
