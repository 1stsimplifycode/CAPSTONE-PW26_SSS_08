  - id: STATS-14
    index: 14
    category: STATS
    slug: ablation_study
    name: Ablation study
    purpose: >-
      All 32 declared arms: single-block, pairwise, leave-one-out, component removal
      and the six combination rules, each with its own hypothesis and artifact bundle.
    research_question: >-
      Which components of the proposed architecture actually contribute, and which are
      redundant or harmful?
    canonical:
      - research/evaluation/ablations.py::all_arms
      - research/evaluation/experiment.py::run
      - scripts/run_experiments.py
    adapter: scripts.stages.stats:ablation_study
    inputs:
      - data/panel/market_dataset.parquet
    outputs:
      - research_artifacts/experiments/ablation_results.csv
      - research_artifacts/experiments/ablation_statistics.csv
    depends_on: [STATS-13]
    wrapper_status: WRAPS_EXISTING_PROTECTED
    status: SUPPORTED
    experiment_id: EXP-ABL-1
    limitations: [L-12]
    notes: >-
      Shares one runner with STATS-13; both are produced by a single invocation of
      scripts/run_experiments.py. Requires --force.
    ui:
      icon: ◫
      product_name: What each component contributes
      route: /stats/ablation
      product_headline: What each part of the system contributes
      product_question: Which components carry the result, and which could be removed without
        changing it?
      product_actions:
      - Compare every arm against the full stack
      - Read the confidence interval and the adjusted p-value, not the point estimate
      - See which differences survive multiplicity correction
      product_observation: Removing the text or market block costs the most; removing the rendered
        image, audio and video channels costs almost nothing, which is expected because those
        channels are views of the same series.
      product_risk: Differences are tested with a paired cluster bootstrap and adjusted for
        multiplicity. A non-significant difference smaller than the minimum detectable effect
        is uninformative rather than evidence that the contribution is zero (CLAIM-07).
      confidence: MODERATE
      visual: ablation_bars
      product_metrics:
      - label: Arms evaluated
        value: csv:research_artifacts/experiments/ablation_results.csv#rows
        format: int
        note: on identical rows
      - label: Comparisons tested
        value: csv:research_artifacts/experiments/ablation_statistics.csv#rows
        format: int
        note: against the full stack
      - label: Largest contribution
        value: csv:research_artifacts/experiments/ablation_statistics.csv#agg:delta_auprc:max
        format: float4
        note: AUPRC lost by removing one component
      research_metrics:
      - label: Significant after correction
        value: csv:research_artifacts/experiments/ablation_statistics.csv#count:significant_fdr_5pct=True
        format: int
      - label: Smallest tested difference
        value: csv:research_artifacts/experiments/ablation_statistics.csv#agg:delta_auprc:min
        format: float4
      figures:
      - fig09_block_ablation
      - fig12_combiner_ablation
      tables:
      - table05_ablation
      - table05b_ablation_statistics
    analysis:
      adapter: scripts.stages.stats:analyse_ablation
      mode: LIVE
      typical_seconds: 3.0
      summary: >-
        Recomputes each arm's detection metrics on the rows you select. The arms were
        fitted once by the experiment runner and are not refitted here, because
        refitting on request would let an arm ranking be chosen after seeing the
        evaluation data.
      inputs:
