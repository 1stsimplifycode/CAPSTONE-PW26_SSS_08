    purpose: >-
      Six baselines under one protocol: statistical anomaly, sentiment-only, text-only,
      market-only, image-only, audio-only and video-only, evaluated against the proposed
      full-stack model on the same split with the same preprocessing.
    research_question: >-
      Does the proposed full-stack model outperform simple, conventional and
      single-block baselines under a fair protocol?
    canonical:
      - research/models/baselines.py::run_all
      - scripts/run_experiments.py
    adapter: scripts.stages.stats:baseline_comparison
    inputs:
      - data/panel/market_dataset.parquet
    outputs:
