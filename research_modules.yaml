        value: csv:outputs/stats/05_regime_statistics/regime_occupancy.csv#agg:share:max
        format: pct
        note: occupancy of the most common state
      - label: Smallest regime share
        value: csv:outputs/stats/05_regime_statistics/regime_occupancy.csv#agg:share:min
        format: pct
        note: occupancy of the least common state
      research_metrics:
      - label: Highest episode rate in a regime
        value: csv:outputs/stats/05_regime_statistics/regime_occupancy.csv#agg:positive_rate:max
        format: pct
      - label: Lowest episode rate in a regime
        value: csv:outputs/stats/05_regime_statistics/regime_occupancy.csv#agg:positive_rate:min
        format: pct
      figures:
      - fig07_regimes
      - fig12b_regime_degeneracy
      tables: []
    analysis:
      adapter: scripts.stages.stats:analyse_regimes
      mode: LIVE
      typical_seconds: 1.2
      summary: >-
        How the rows you selected distribute across regimes, and the episode rate inside
        each. A regime holding thirty rows supports very little on its own, so the row
        count is reported beside every share.
      inputs:
        - name: date_from
          kind: date
          label: From
          default: '2022-01-01'
          minimum: '2015-01-01'
          maximum: '2026-08-14'
          note: >-
            first session included
        - name: date_to
          kind: date
          label: To
          default: '2024-12-31'
          minimum: '2015-01-01'
          maximum: '2026-08-14'
          note: >-
            last session included
        - name: instruments
          kind: symbols
          label: Instruments
          default: []
          max_items: 60
          note: >-
            leave empty for every instrument in the range
        - name: split
          kind: select
          label: Split
          default: all
          options:
            - all
            - train
            - validation
            - holdout
          note: >-
            regime occupancy can differ between splits, which is worth checking

  - id: STATS-06
    index: 6
    category: STATS
    slug: dependence_propagation
    name: Dependence and propagation statistics
    purpose: >-
      Structure of the statistical co-movement graph: edge counts, degree distribution and
      neighbour counts per instrument-day.
    research_question: >-
      What dependence structure exists between instruments, and how far can it be read
      without a causal identification strategy?
    canonical:
      - research/propagation/graph.py::correlation_graph
      - research/propagation/graph.py::PROPAGATION_FEATURES
    adapter: scripts.stages.stats:dependence_propagation
    inputs:
      - data/panel/market_dataset.parquet
    outputs:
      - outputs/stats/06_dependence_propagation/graph_summary.json
    depends_on: [STATS-01]
    wrapper_status: WRAPS_EXISTING
    status: PARTIAL
    experiment_id: EXP-N05-1
    limitations: [L-07]
    notes: >-
      Statistical co-movement, never causal propagation (L-07). The propagation block's
      contribution is a measured near-null (N-05).
    ui:
      icon: ⬡
      product_name: How instruments move together
      route: /stats/propagation
      product_headline: How instruments move together
      product_question: Do cross-instrument co-movement features carry information beyond the
        instrument's own series?
      product_actions:
      - See the propagation features and how completely they are populated
      - Read the mean neighbour count per instrument-day
      - Check the causal caveat before reading anything into an edge
      product_observation: The graph is well populated, and the block's incremental contribution
        is measured to be negligible under an episode generator that places episodes independently
        per instrument (N-05).
      product_risk: These are statistical co-movement edges only (L-07). No edge here says that
        one instrument moved another, and none may be read that way.
      confidence: LOW
      visual: stat_row
      product_metrics:
      - label: Propagation features
        value: json:outputs/stats/06_dependence_propagation/graph_summary.json#propagation_features_declared
        format: count
        note: declared and present
      - label: Fraction populated
        value: json:outputs/stats/06_dependence_propagation/graph_summary.json#mean_non_null_fraction
        format: pct
        note: mean across the block
      - label: Neighbours per instrument-day
        value: json:outputs/stats/06_dependence_propagation/graph_summary.json#per_feature_mean.prop_n_neighbours
        format: float1
        note: mean graph degree
      - label: Mean absolute correlation
        value: json:outputs/stats/06_dependence_propagation/graph_summary.json#per_feature_mean.prop_mean_abs_corr
        format: float3
        note: edge strength on the graph
      research_metrics:
      - label: Mean neighbour stress
        value: json:outputs/stats/06_dependence_propagation/graph_summary.json#per_feature_mean.prop_stress
        format: float4
      - label: Mean neighbour disagreement
        value: json:outputs/stats/06_dependence_propagation/graph_summary.json#per_feature_mean.prop_disagreement
        format: float4
      - label: Caveat
        value: json:outputs/stats/06_dependence_propagation/graph_summary.json#caveat
        format: text
      figures:
      - fig18_propagation
      tables: []
    analysis:
      adapter: scripts.stages.stats:analyse_dependence
      mode: LIVE
      typical_seconds: 9.0
      summary: >-
        Contemporaneous co-movement between the instruments you select, measured on
        their return series over the sessions you choose, beside the propagation feature
        block. Association only: nothing here identifies which instrument moved first.
      inputs:
        - name: date_from
          kind: date
          label: From
          default: '2022-01-01'
          minimum: '2015-01-01'
          maximum: '2026-08-14'
          note: >-
            first session correlated
        - name: date_to
          kind: date
          label: To
          default: '2024-12-31'
          minimum: '2015-01-01'
          maximum: '2026-08-14'
          note: >-
            last session correlated
        - name: instruments
          kind: symbols
          label: Instruments
          default: []
          max_items: 60
          note: >-
            choose a handful; every pair among them is measured
        - name: top_n
          kind: int
          label: Pairs to show
          default: 15
          minimum: 5
          maximum: 60
          note: >-
            how many of the strongest associations to list

  - id: STATS-07
    index: 7
    category: STATS
    slug: tail_extreme_risk
    name: Tail and extreme-risk statistics
    purpose: >-
      Tail behaviour of the exposure-gate research instrument: CVaR, maximum drawdown and
      the distribution of the net series it produces.
    research_question: >-
      What are the tail characteristics of the research exposure policy, treated strictly
      as a measurement instrument rather than as a strategy?
    canonical:
      - research/risk/gate.py::tail_metrics
      - research/risk/gate.py::capital_consequence
    adapter: scripts.stages.stats:tail_extreme_risk
    inputs:
      - research_artifacts/experiments/per_row_FULL.parquet
    outputs:
      - outputs/stats/07_tail_extreme_risk/tail_metrics.json
    depends_on: [STATS-13]
    wrapper_status: WRAPS_EXISTING
    status: PARTIAL
    experiment_id: null
    limitations: []
    notes: >-
      The exposure policy is a research instrument and is never an allocation. Nothing in
      this module produces a position size.
    ui:
      icon: ◤
      product_name: Extreme moves
      route: /stats/tail-risk
      product_headline: The shape of the return distribution being scored
      product_question: What does the tail of the realised return distribution look like over
        the rows this system scores?
      product_actions:
      - Read the unconditional tail statistics of the scored rows
      - See which extreme days are corporate-action suspects
      - Understand the input distribution before reading a risk result
      product_observation: These are unconditional statistics of the realised next-session return
        over the scored rows. They describe the input distribution, not the behaviour of any
        strategy.
      product_risk: Prices are unadjusted for splits and bonuses, so the most extreme days are
